<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案 B · 主副赛道式</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #020814;
            color: #c0d8e8;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .container { max-width: 720px; margin: 0 auto; }

        /* Header */
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 {
            font-size: 22px;
            color: #5a9ec8;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .header .subtitle {
            font-size: 13px;
            color: #7aafc8;
        }

        /* Track Label */
        .track-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .track-label.main {
            background: rgba(90, 158, 200, 0.15);
            color: #5a9ec8;
            border: 1px solid #5a9ec8;
        }
        .track-label.side {
            background: rgba(192, 216, 232, 0.1);
            color: #c0d8e8;
            border: 1px solid rgba(192, 216, 232, 0.4);
        }

        /* Main Track - Leaderboard */
        .main-track {
            background: rgba(90, 158, 200, 0.08);
            border: 2px solid #1a3a4a;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 12px;
            position: relative;
        }
        .main-track::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5a9ec8, transparent);
        }

        .lb-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(26, 58, 74, 0.5);
        }
        .lb-item:last-child { border-bottom: none; }
        .lb-rank {
            width: 44px;
            text-align: center;
            font-size: 22px;
        }
        .lb-info { flex: 1; }
        .lb-name {
            font-size: 15px;
            color: #e0e8f0;
            font-weight: 600;
        }
        .lb-amount {
            font-size: 13px;
            color: #7aafc8;
            margin-top: 2px;
        }
        .lb-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            background: rgba(90, 158, 200, 0.2);
            border: 1px solid #5a9ec8;
            border-radius: 10px;
            font-size: 10px;
            color: #5a9ec8;
        }

        /* Connector */
        .connector {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 4px 0 8px;
        }
        .connector-line {
            width: 2px;
            height: 24px;
            background: linear-gradient(to bottom, #5a9ec8, rgba(192, 216, 232, 0.3));
        }
        .connector-text {
            font-size: 11px;
            color: #7aafc8;
            padding: 4px 12px;
            background: rgba(192, 216, 232, 0.08);
            border: 1px dashed rgba(192, 216, 232, 0.3);
            border-radius: 12px;
            margin-top: 4px;
        }

        /* Side Track - Daily Challenge */
        .side-track {
            background: rgba(192, 216, 232, 0.04);
            border: 1px solid rgba(192, 216, 232, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
        }
        .side-track-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .side-track-title {
            font-size: 14px;
            color: #c0d8e8;
            font-weight: 600;
        }
        .side-track-current {
            font-size: 12px;
            color: #7aafc8;
        }

        .daily-record {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: rgba(90, 158, 200, 0.06);
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .daily-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(90, 158, 200, 0.2);
            border: 2px solid #5a9ec8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .daily-info { flex: 1; }
        .daily-name {
            font-size: 14px;
            color: #e0e8f0;
            font-weight: 600;
        }
        .daily-amount {
            font-size: 12px;
            color: #5a9ec8;
            margin-top: 2px;
        }
        .daily-note {
            font-size: 11px;
            color: #7aafc8;
            padding: 8px 12px;
            background: rgba(192, 216, 232, 0.05);
            border-radius: 8px;
            border-left: 2px solid rgba(192, 216, 232, 0.3);
        }

        .side-rewards {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(26, 58, 74, 0.5);
        }
        .side-reward-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #7aafc8;
            padding: 3px 0;
        }
        .side-reward-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c0d8e8;
        }

        /* Stacking Note */
        .stacking-note {
            text-align: center;
            padding: 14px;
            background: rgba(90, 158, 200, 0.08);
            border: 1px dashed #5a9ec8;
            border-radius: 12px;
            font-size: 12px;
            color: #5a9ec8;
        }
        .stacking-note strong { color: #c0d8e8; }

        @media (max-width: 480px) {
            .daily-record { padding: 10px; }
            .daily-avatar { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ 至尊暴龙王争夺战</h1>
            <div class="subtitle">第五届 · 全面升级</div>
        </div>

        <!-- 主赛道 -->
        <div class="track-label main">🏆 主赛道</div>
        <div class="main-track">
            <div class="lb-item">
                <div class="lb-rank">🥇</div>
                <div class="lb-info">
                    <div class="lb-name">
                        玩家 A
                        <span class="lb-badge">⚡ 今日争夺者</span>
                    </div>
                    <div class="lb-amount">2,500,000 vàng</div>
                </div>
            </div>
            <div class="lb-item">
                <div class="lb-rank">🥈</div>
                <div class="lb-info">
                    <div class="lb-name">玩家 B</div>
                    <div class="lb-amount">1,800,000 vàng</div>
                </div>
            </div>
            <div class="lb-item">
                <div class="lb-rank">🥉</div>
                <div class="lb-info">
                    <div class="lb-name">玩家 C</div>
                    <div class="lb-amount">1,200,000 vàng</div>
                </div>
            </div>
            <div class="lb-item">
                <div class="lb-rank">4</div>
                <div class="lb-info">
                    <div class="lb-name">...</div>
                </div>
            </div>
            <div class="lb-item">
                <div class="lb-rank">5</div>
                <div class="lb-info">
                    <div class="lb-name">您</div>
                    <div class="lb-amount">500,000 vàng</div>
                </div>
            </div>
        </div>

        <!-- 连接箭头 -->
        <div class="connector">
            <div class="connector-line"></div>
            <div class="connector-text">↓ 额外挑战</div>
        </div>

        <!-- 副赛道 -->
        <div class="track-label side">⚡ 副赛道</div>
        <div class="side-track">
            <div class="side-track-header">
                <div class="side-track-title">单日巅峰挑战</div>
                <div class="side-track-current">6天中单日最高者</div>
            </div>

            <div class="daily-record">
                <div class="daily-avatar">⚡</div>
                <div class="daily-info">
                    <div class="daily-name">玩家 A</div>
                    <div class="daily-amount">500,000 vàng · Day 3</div>
                </div>
            </div>

            <div class="daily-note">
                此人今日发力最猛，是最有力的夺冠竞争者
            </div>

            <div class="side-rewards">
                <div class="side-reward-item">
                    <div class="dot"></div>
                    强化卡 ×30
                </div>
                <div class="side-reward-item">
                    <div class="dot"></div>
                    实时发放 · 可与冠军叠加
                </div>
            </div>
        </div>

        <div class="stacking-note">
            <strong>🎁 叠加规则：</strong>同一人可获主赛道 + 副赛道双奖<br>
            冠军 = 体型+50% + 强化卡×50 + 名人殿堂<br>
            单日巅峰 = 强化卡×30
        </div>
    </div>
</body>
</html>
