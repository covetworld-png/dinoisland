<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cập nhật thông tin nhân viên</title>
<style>
  :root { --primary:#2563eb; --primary-2:#1d4ed8; --danger:#dc2626; --ok:#16a34a; --border:#e2e8f0; --bg:#f1f5f9; --text:#0f172a; --muted:#64748b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
         background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:640px; margin:0 auto; padding:10px 14px 42px; }
  header { text-align:center; padding:8px 0 2px; }
  header h1 { font-size:21px; color:#1e293b; letter-spacing:-.2px; }
  header p { font-size:12.5px; color:var(--muted); margin-top:3px; }
  .lang-btn { display:inline-block; background:#eef4ff; border:1px solid #c7d8f7; color:var(--primary-2);
    border-radius:99px; padding:4px 16px; font-size:12.5px; font-weight:600; cursor:pointer; margin-bottom:10px; }
  .lang-btn:active { transform:scale(.97); }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-top:12px;
          box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .card h2 { font-size:14.5px; color:#1e3a8a; border-left:3px solid var(--primary); padding-left:10px; margin-bottom:14px; }
  .field { display:block; margin-bottom:11px; }
  .field > span { display:block; font-size:12.5px; color:#475569; margin-bottom:5px; font-weight:500; }
  .field .req { color:var(--danger); margin-left:2px; }
  .field input, .field select { width:100%; padding:10px 12px; font-size:14.5px; border:1px solid #d8dee9;
    border-radius:10px; background:#fff; -webkit-appearance:none; appearance:none;
    transition:border-color .15s, box-shadow .15s; }
  .field input:focus, .field select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .field input:hover, .field select:hover { border-color:#b6c2d4; }
  .hint { font-size:11.5px; color:#94a3b8; margin-top:4px; }
  .info { display:flex; gap:8px; align-items:flex-start; background:#f0f7ff; border:1px solid #dbeafe;
    border-radius:12px; padding:10px 12px; font-size:12.5px; color:#1e40af; margin-top:12px; line-height:1.6; }
  .info .ico { font-size:14px; flex-shrink:0; line-height:1.4; }
  button { padding:13px; font-size:15.5px; font-weight:600; border:none; border-radius:12px; cursor:pointer; font-family:inherit; }
  .btn-primary { display:block; width:100%; background:linear-gradient(180deg,#3b82f6,#2563eb); color:#fff; margin-top:18px;
    box-shadow:0 2px 8px rgba(37,99,235,.28); transition:box-shadow .15s, transform .05s; }
  .btn-primary:hover { box-shadow:0 3px 12px rgba(37,99,235,.38); }
  .btn-primary:active { transform:translateY(1px); }
  .btn-primary:disabled { background:#bcd3f8; box-shadow:none; cursor:not-allowed; }
  .status { text-align:center; padding:22px 16px; background:#fff; border:1px solid var(--border); border-radius:14px;
    margin-top:12px; box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .status .icon { font-size:46px; }
  .status .msg { font-size:15.5px; margin-top:12px; }
  .status .sub { font-size:12.5px; color:var(--muted); margin-top:6px; }
  .status .err { color:var(--danger); }
  .status .ok { color:var(--ok); }
  footer { text-align:center; font-size:11.5px; color:#94a3b8; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button type="button" class="lang-btn" id="langBtn">中文</button>
    <h1 data-zh="员工信息更新">Cập nhật thông tin nhân viên</h1>
    <p id="empLabel">Vui lòng điền đầy đủ thông tin dưới đây</p>
  </header>

  <!-- 校验失败 / 已提交 -->
  <div id="msgView" class="status hidden">
    <div class="icon" id="msgIcon"></div>
    <div class="msg" id="msgText"></div>
    <div class="sub" id="msgSub"></div>
  </div>

  <!-- 表单 -->
  <div id="formView" class="hidden">
    <div class="info">
      <span class="ico">ℹ️</span>
      <span data-zh="只需填写需要变更的信息；带 * 的为必填。">Chỉ điền phần cần thay đổi; trường có * là bắt buộc.</span>
    </div>

    <div class="card">
      <h2 data-zh="👤 个人信息">👤 Thông tin cá nhân</h2>
      <label class="field"><span><span data-zh="姓名">Họ và tên</span><span class="req">*</span></span>
        <input type="text" id="f_real_name" placeholder="Ví dụ: Nguyễn Văn A" data-zh-placeholder="例如：Nguyễn Văn A"></label>
      <label class="field"><span data-zh="性别">Giới tính</span>
        <select id="f_gender">
          <option value="" data-zh="-- 请选择 --">-- Chọn --</option>
          <option value="1">Nam</option>
          <option value="2">Nữ</option>
        </select></label>
      <label class="field"><span data-zh="出生日期">Ngày sinh</span>
        <input type="date" id="f_birth_date"></label>
      <label class="field"><span data-zh="手机 / Zalo">SĐT / Zalo</span>
        <input type="tel" id="f_phone_zalo" placeholder="Số điện thoại hoặc Zalo" data-zh-placeholder="手机号或 Zalo"></label>
      <label class="field"><span data-zh="邮箱">Email</span>
        <input type="email" id="f_email" placeholder="Email (nếu có)" data-zh-placeholder="邮箱（如有）"></label>
      <label class="field"><span data-zh="身份证号">Số CCCD / CMND</span>
        <input type="text" id="f_id_card" placeholder="Số căn cước công dân" data-zh-placeholder="身份证号"></label>
    </div>

    <div class="card">
      <h2 data-zh="🏦 银行账户信息">🏦 Thông tin tài khoản ngân hàng</h2>
      <label class="field"><span data-zh="收款人（收款账户户名）">Người thụ hưởng</span>
        <input type="text" id="f_account_holder" placeholder="Để trống nếu là tài khoản của chính bạn" data-zh-placeholder="本人账户可留空">
        <span class="hint" data-zh="若工资打入他人账户，请填写该账户户名">Nếu nhận lương qua tài khoản người khác, điền tên người đó</span></label>
      <label class="field"><span><span data-zh="开户银行">Ngân hàng</span><span class="req">*</span></span>
        <input type="text" id="f_bank" placeholder="Ví dụ: Vietcombank, MB, Techcombank" data-zh-placeholder="例如：Vietcombank、MB、Techcombank"></label>
      <label class="field"><span><span data-zh="银行账号">Số tài khoản</span><span class="req">*</span></span>
        <input type="text" id="f_account" placeholder="Số tài khoản ngân hàng" data-zh-placeholder="银行账号"></label>
      <label class="field"><span data-zh="收款人手机号">SĐT người thụ hưởng</span>
        <input type="tel" id="f_payee_phone" placeholder="Số điện thoại (nếu có)" data-zh-placeholder="手机号（如有）"></label>
    </div>

    <div class="card">
      <h2 data-zh="🏠 家庭信息">🏠 Thông tin gia đình</h2>
      <label class="field"><span data-zh="家庭住址">Địa chỉ nhà</span>
        <input type="text" id="f_address" placeholder="Địa chỉ hiện tại" data-zh-placeholder="现居地址"></label>
      <label class="field"><span data-zh="紧急联系人">Người liên hệ khẩn cấp</span>
        <input type="text" id="f_emergency_contact" placeholder="Tên người thân" data-zh-placeholder="亲属姓名"></label>
      <label class="field"><span data-zh="与联系人关系">Quan hệ</span>
        <select id="f_emergency_relation">
          <option value="" data-zh="-- 请选择 --">-- Chọn --</option>
          <option value="父母">Bố mẹ</option>
          <option value="配偶">Vợ / chồng</option>
          <option value="兄弟">Anh / chị / em</option>
          <option value="其他">Khác</option>
        </select></label>
      <label class="field"><span data-zh="紧急联系电话">SĐT liên hệ khẩn cấp</span>
        <input type="tel" id="f_emergency_phone" placeholder="Số điện thoại người thân" data-zh-placeholder="亲属手机号"></label>
    </div>

    <button class="btn-primary" id="submitBtn">Gửi thông tin</button>
  </div>

  <footer data-zh="员工自助信息更新 · Member Admin">Member Admin · 员工自助信息更新</footer>
</div>
<script src="self.js?v=20260920b"></script>
</body>
</html>
