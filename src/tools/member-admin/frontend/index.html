<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理后台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- 登录页 -->
  <div id="loginView" class="login-page hidden">
    <div class="login-card">
      <h1 class="login-title">员工管理后台</h1>
      <p class="login-subtitle">Member Admin</p>
      <form id="loginForm">
        <label class="field">
          <span>用户名</span>
          <input type="text" id="loginUsername" autocomplete="username" required>
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
      </form>
    </div>
  </div>

  <!-- 模块入口页 -->
  <div id="portalView" class="portal-page hidden">
    <header class="topbar">
      <span class="topbar-brand" id="portalBrand">员工管理后台</span>
      <div class="topbar-right">
        <span class="topbar-user">当前用户：<b id="portalUsername"></b></span>
        <button class="btn btn-ghost" id="portalChangePwdBtn">修改密码</button>
        <button class="btn btn-ghost danger" id="portalLogoutBtn">退出登录</button>
      </div>
    </header>
    <main class="portal-main">
      <h2 class="portal-heading">选择管理模块</h2>
      <div class="portal-cards">
        <div class="portal-card" id="gameModuleCard">
          <div class="portal-card-icon">🎮</div>
          <h3>游戏管理</h3>
          <p>员工 / 军团 / 游戏账号 / 收款账户 / 操作日志</p>
          <span class="portal-card-action">进入 →</span>
        </div>
        <div class="portal-card" id="liveModuleCard">
          <div class="portal-card-icon">📺</div>
          <h3>直播管理</h3>
          <p>员工 / 人员信息</p>
          <span class="portal-card-action">进入 →</span>
        </div>
      </div>
    </main>
  </div>

  <!-- 游戏管理后台 -->
  <div id="adminView" class="admin-layout hidden">
    <aside class="sidebar">
      <div class="sidebar-brand" id="sidebarBrand">游戏管理</div>
      <nav class="sidebar-nav">
        <button class="side-btn" data-module="employees" data-group="game">员工</button>
        <button class="side-btn" data-module="guilds" data-group="game">军团</button>
        <button class="side-btn" data-module="accounts" data-group="game">账号</button>
        <button class="side-btn" data-module="payments" data-group="game">收款账户</button>
        <button class="side-btn" data-module="query" data-group="game">数据查询</button>
        <button class="side-btn" data-module="commission" data-group="game">月度分成</button>
        <button class="side-btn" data-module="logs" data-group="game">操作日志</button>
        <button class="side-btn hidden" data-module="users" data-group="game" id="usersNavBtn">用户管理</button>
        <button class="side-btn" data-module="live_employees" data-group="live">员工</button>
        <button class="side-btn" data-module="player_mapping" data-group="live">陪玩映射</button>
        <button class="side-btn" data-module="pids" data-group="live">PID 全景</button>
        <button class="side-btn hidden" data-module="users" data-group="live" id="usersNavBtnLive">用户管理</button>
        <button class="side-btn" data-module="logs" data-group="live">操作日志</button>
        <button class="side-btn" data-module="binding" data-group="live">Discord绑定</button>
        <button class="side-btn" data-module="checkin" data-group="live">场次签到</button>
        <button class="side-btn" data-module="inbox" data-group="live">消息中心 <span id="inboxBadge" style="display:none;background:#dc2626;color:#fff;border-radius:9px;padding:0 6px;font-size:10px;line-height:16px;margin-left:4px"></span></button>
        <button class="side-btn" data-module="schedule" data-group="live" onclick="window.open('https://covetworld-png.github.io/dinoisland/src/tools/streamer-schedule/index.html','_blank')">排班表</button>
        <button class="side-btn" data-module="paycode" data-group="all">工资代发收款码</button>
      </nav>
      <div class="sidebar-footer">
        <button class="side-btn back" id="backToPortalBtn">← 返回入口</button>
      </div>
    </aside>
    <div class="admin-content">
      <header class="topbar">
        <span class="topbar-title" id="adminModuleTitle">员工</span>
        <div class="topbar-right">
          <span class="topbar-user">当前用户：<b id="adminUsername"></b></span>
          <button class="btn btn-ghost" id="adminChangePwdBtn">修改密码</button>
          <button class="btn btn-ghost danger" id="adminLogoutBtn">退出登录</button>
        </div>
      </header>
      <main class="admin-main" id="adminMain"></main>
    </div>
  </div>

  <!-- 通用表单弹窗 -->
  <div id="formModal" class="modal hidden">
    <div class="modal-overlay" data-close="formModal"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="formModalTitle">新增</h3>
        <div style="display:flex;align-items:center;gap:6px"><span id="formModalHeaderBtns"></span><button type="button" class="modal-close" data-close="formModal">&times;</button></div>
      </div>
      <div class="modal-body" id="formModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="formModal">取消</button>
        <button type="button" class="btn btn-primary" id="formModalSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="pwdModal" class="modal hidden">
    <div class="modal-overlay" data-close="pwdModal"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3>修改密码</h3>
        <button type="button" class="modal-close" data-close="pwdModal">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>原密码</span>
          <input type="password" id="oldPassword" autocomplete="current-password">
        </label>
        <label class="field">
          <span>新密码</span>
          <input type="password" id="newPassword" autocomplete="new-password">
        </label>
        <label class="field">
          <span>确认新密码</span>
          <input type="password" id="newPassword2" autocomplete="new-password">
        </label>
        <p id="pwdError" class="form-error hidden"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="pwdModal">取消</button>
        <button type="button" class="btn btn-primary" id="pwdSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 员工详情抽屉 -->
  <div id="drawer" class="drawer hidden">
    <div class="drawer-overlay" data-close="drawer"></div>
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3 id="drawerTitle">员工详情</h3>
        <button type="button" class="modal-close" data-close="drawer">&times;</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <!-- 游戏数据弹窗 -->
  <div id="gameDataModal" class="modal hidden">
    <div class="modal-overlay" data-close="gameDataModal"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>账号游戏数据</h3>
        <button type="button" class="modal-close" data-close="gameDataModal">&times;</button>
      </div>
      <div class="modal-body" id="gameDataBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="gameDataModal">关闭</button>
      </div>
    </div>
  </div>

  <!-- SQL 脚本新增/编辑弹窗 -->
  <div id="sqlScriptModal" class="modal hidden">
    <div class="modal-overlay" data-close="sqlScriptModal"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="sqlScriptModalTitle">新增脚本</h3>
        <button type="button" class="modal-close" data-close="sqlScriptModal">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>名称 *</span>
          <input type="text" id="ssName" required>
        </label>
        <label class="field">
          <span>说明</span>
          <input type="text" id="ssDesc">
        </label>
        <label class="field">
          <span>参数</span>
          <input type="text" id="ssParams" placeholder="逗号分隔，如 month_start,month_end">
        </label>
        <label class="field">
          <span>SQL</span>
          <textarea id="ssSql" rows="10" style="font-family:Menlo,Consolas,monospace;font-size:13px;"></textarea>
        </label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="sqlScriptModal">取消</button>
        <button type="button" class="btn btn-primary" id="sqlScriptSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 脚本执行参数弹窗 -->
  <div id="runParamsModal" class="modal hidden">
    <div class="modal-overlay" data-close="runParamsModal"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3 id="runParamsTitle">执行参数</h3>
        <button type="button" class="modal-close" data-close="runParamsModal">&times;</button>
      </div>
      <div class="modal-body" id="runParamsBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="runParamsModal">取消</button>
        <button type="button" class="btn btn-primary" id="runParamsRunBtn">执行</button>
      </div>
    </div>
  </div>

  <!-- 发放快照备注弹窗（保存 / 编辑备注共用） -->
  <div id="snapshotRemarkModal" class="modal hidden">
    <div class="modal-overlay" data-close="snapshotRemarkModal"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3 id="snapshotRemarkTitle">保存为发放记录</h3>
        <button type="button" class="modal-close" data-close="snapshotRemarkModal">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>备注</span>
          <input type="text" id="snapRemark" placeholder="如 2026-06 发放">
        </label>
        <div id="snapEmpExpectationsWrap" style="max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:8px;">
          <!-- 按员工期望输入由 JS 动态生成 -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="snapshotRemarkModal">取消</button>
        <button type="button" class="btn btn-primary" id="snapRemarkSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 用户管理弹窗（新增 / 改角色 / 重置密码共用） -->
  <div id="userModal" class="modal hidden">
    <div class="modal-overlay" data-close="userModal"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3 id="userModalTitle">新增用户</h3>
        <button type="button" class="modal-close" data-close="userModal">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field" id="userFieldUsername">
          <span>用户名 *</span>
          <input type="text" id="userUsername" autocomplete="off">
        </label>
        <label class="field" id="userFieldPassword">
          <span>密码 *（至少 6 位）</span>
          <input type="password" id="userPassword" autocomplete="new-password">
        </label>
        <label class="field" id="userFieldRole">
          <span>角色</span>
          <select id="userRole">
            <option value="super">超级管理员</option>
            <option value="admin">管理员</option>
            <option value="viewer">普通用户</option>
          </select>
        </label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="userModal">取消</button>
        <button type="button" class="btn btn-primary" id="userModalSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- SQL 脚本生成器弹窗 -->
  <div id="sqlGenModal" class="modal hidden">
    <div class="modal-overlay" data-close="sqlGenModal"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>脚本生成器</h3>
        <button type="button" class="modal-close" data-close="sqlGenModal">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>脚本名称 *</span>
          <input type="text" id="sgName">
        </label>
        <label class="field">
          <span>说明</span>
          <input type="text" id="sgDesc">
        </label>
        <label class="field">
          <span>SQL（参数用 %(参数名)s 占位）</span>
          <textarea id="sgSql" rows="8" style="font-family:Menlo,Consolas,monospace;font-size:13px;"
            placeholder="SELECT * FROM orders WHERE server_id = %(server_id)s AND paid_at >= %(day)s"></textarea>
        </label>
        <div style="margin-bottom:12px;display:flex;gap:8px;">
          <button type="button" class="btn" id="sgParseBtn">解析参数</button>
          <button type="button" class="btn" id="sgSmartBtn">智能解析</button>
        </div>
        <div id="sgSmartArea" style="margin-bottom:12px;"></div>
        <div id="sgParamsArea"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-close="sqlGenModal">取消</button>
        <button type="button" class="btn btn-primary" id="sgSaveBtn">保存脚本</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <input type="file" id="imageFileInput" accept="image/*" class="hidden">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/app.js?v=20260913l"></script>
</body>
</html>
